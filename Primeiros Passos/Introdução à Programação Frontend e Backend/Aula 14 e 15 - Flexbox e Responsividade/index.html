<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCTEC - Aula 14 e 15</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>FLEXBOX [display + flex-direction]</h2>
    <section class="container-row">
        <div class="box" id="box-title">#row</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <section class="container-row-reverse">
        <div class="box" id="box-title">#row<br>reverse</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <section class="container-column">
        <div class="box" id="box-title">#column</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <section class="container-column-reverse">
        <div class="box" id="box-title">#column<br>reverse</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <h2>FLEXBOX [justify-content + align-items]</h2>
    <section class="container-justify-right">
        <div class="box" id="box-title">#right</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <section class="container-justify-center">
        <div class="box" id="box-title">#center</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <section class="container-justify-around">
        <div class="box" id="box-title">#around</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <section class="container-justify-btw">
        <div class="box" id="box-title">#btw</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
    <section class="container-justify-evenly">
        <div class="box" id="box-title">#evenly</div>
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </section>
</body>
</body>
</html>
