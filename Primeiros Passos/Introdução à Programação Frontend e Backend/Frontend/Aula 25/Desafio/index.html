<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCTEC - Desafio da Aula 25</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card-container">
        <h1>Pedidos da Pizzaria</h1>
        <div class="quote-container">
            <blockquote>
            Essa é a minha resolução do <span class="bold">SCTEC - Desafio da Aula 25</span>, <br>que solicita a criação
            de um programa que
            retorne o pedido de uma pizarria de acordo com o valor informado no campo de entrada.
        </blockquote>
        </div>
        <div class="formulario">
            <div class="campo">
                <label>Número do Pedido:</label>
                <input type="text" id="numPedido" placeholder="Exemplo: 1">
            </div>
            <button onclick="clientePedido()" id="verificar">Verificar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
